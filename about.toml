# about.toml — cargo-about configuration
# Used by CI lint job to verify all third-party license attributions.
# See: https://embarkstudios.github.io/cargo-about/
#
# cargo-about v0.9 format.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "LicenseRef-ring",
]

# Skip workspace-internal crates (publish = false; MIT; no external attribution needed).
ignore-build-dependencies = false
ignore-dev-dependencies = true

[codewiki-cli]
accepted = ["MIT"]

[codewiki-core]
accepted = ["MIT"]

[codewiki-extraction]
accepted = ["MIT"]

[codewiki-mcp]
accepted = ["MIT"]

[codewiki-resolution]
accepted = ["MIT"]

[codewiki-storage]
accepted = ["MIT"]

[codewiki-sync]
accepted = ["MIT"]

[codewiki-testutil]
accepted = ["MIT"]
